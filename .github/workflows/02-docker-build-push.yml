name: Implantar no Docker Hub (Develop)

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Efetuar login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/infra-b3-ecossystem
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=develop
            type=raw,value=latest

      - name: Validar configuração Terraform
        run: |
          docker run --rm --entrypoint terraform \
            -v ${{ github.workspace }}/infra:/infra \
            -w /infra \
            hashicorp/terraform:latest \
            validate

      - name: Construir e enviar para Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./infra
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/infra-b3-ecossystem:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/infra-b3-ecossystem:buildcache,mode=max

