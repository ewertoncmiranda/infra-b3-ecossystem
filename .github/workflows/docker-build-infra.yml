name: Construir e Enviar Imagem Docker de Infraestrutura

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'infra/**'
      - '.github/workflows/docker-build-infra.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infra/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ewertonmiranda/infra-b3-ecossystem

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Efetuar login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Inicializar Terraform
        run: |
          docker run --rm --entrypoint terraform \
            -v ${{ github.workspace }}/infra:/infra \
            -w /infra \
            hashicorp/terraform:latest \
            init -backend=false

      - name: Validar configuração Terraform
        run: |
          docker run --rm --entrypoint terraform \
            -v ${{ github.workspace }}/infra:/infra \
            -w /infra \
            hashicorp/terraform:latest \
            validate

      - name: Verificar formatação de arquivos Terraform
        run: |
          docker run --rm --entrypoint terraform \
            -v ${{ github.workspace }}/infra:/infra \
            -w /infra \
            hashicorp/terraform:latest \
            fmt -check -recursive

      - name: Construir imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./infra
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar imagem quanto a vulnerabilidades
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Enviar resultados Trivy para Segurança GitHub
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'Trivy'

      - name: Atualizar Descrição no Docker Hub
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/infra-b3-ecossystem
          short-description: "Provisionador de Infraestrutura como Código para Ecossistema B3"
          readme-filepath: ./PUSH_INSTRUCTIONS.md
