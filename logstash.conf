input {
  file {
    path => "/logs/**/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-app-logs"
    # As linhas de log da aplicacao nao sao JSON puro (uma por linha) - o
    # codec "json" tentava reinterpretar o arquivo inteiro e falhava com
    # _jsonparsefailure em 100% dos documentos. "plain" so le a linha crua.
    codec => plain
  }

  tcp {
    port => 5000
    codec => json_lines
  }

  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => {
      "app_log_message" => "%{message}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "b3-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}